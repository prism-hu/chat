services:
  nucllei:
    # technoplasm/nucllei — Open WebUI fork used as the chat frontend.
    # 上流 CI が GHCR に出すのは amd64 のみ。DGX Spark は aarch64 なので
    # submodule (vendor/nucllei) から自前ビルドする:
    #   git submodule update --init --recursive
    #   docker compose build nucllei
    # 版を上げるときは submodule を目的の tag に進めてから再ビルド。
    image: nucllei:local
    build:
      context: ./vendor/nucllei
    container_name: nucllei
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      # public base URL (RC): webhooks / share links
      - WEBUI_URL=https://chat.prism-hu.org
      # shipped locales: ja / en / zh-CN
      - DEFAULT_LOCALE=ja
      # LiteLLM is the ONLY model source (Claude / vLLM / Ollama all come through it).
      # Ollama is no longer wired up directly — it is a wildcard route in litellm/config.yaml.
      #
      # kimi-k2.6 を生 pass-through (/sglang) に分ける案は取り下げた。認証付き
      # pass-through が LiteLLM Enterprise 限定で、無料版では proxy を定義した
      # 時点で起動に失敗するため (litellm/config.yaml のコメント参照)。
      - OPENAI_API_BASE_URL=http://prism-gw:4000/v1
      - OPENAI_API_KEY=${PRISM_GW_API_KEY:?Set PRISM_GW_API_KEY in .env (see .env.example)}
      - ENABLE_OLLAMA_API=false
    ports:
      - "8080:8080"
    volumes:
      # DATA_DIR: SQLite webui.db, uploads, caches, secret key
      - nucllei:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - prism-gw
    restart: always

  # prism-gw — 唯一の入口 (:4000)。クライアントのキーは PRISM_GW_API_KEY の 1 本だけ。
  #
  # 仕事は「組み直さないこと」。ボディの model を見て上流を決め、ヘッダの認証だけ
  # 差し替えて本文はバイトのまま流す。これにより sglang/vLLM の `max_model_len` と
  # ストリーム中の累積 usage (= ライブ tok/s) が生きたまま届く。
  # LiteLLM も Bifrost も組み直すので両方とも消える (実測: docs/gateway.md)。
  #
  # ルーティングは gateway/config.yaml に宣言的に書く。編集したら restart するだけ。
  prism-gw:
    image: prism-gw:local
    build:
      context: ./gateway
    container_name: prism-gw
    ports:
      - "4000:4000"
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      # **このスタックで唯一クライアントに渡すキー。** これ 1 本で全モデルに到達できる。
      - PRISM_GW_API_KEY=${PRISM_GW_API_KEY:?Set PRISM_GW_API_KEY in .env (see .env.example)}
      # 上流に差し替えるキー。クライアントには出ない。
      # LiteLLM はホスト非公開なので master key も同じ値を流用する
      # (別にしたいときだけ .env に LITELLM_MASTER_KEY を書く)。
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-${PRISM_GW_API_KEY}}
      - KIMI_API_KEY=${KIMI_API_KEY:-}
    volumes:
      # マウントしておくと config 編集 → restart だけで反映される (再ビルド不要)
      - ./gateway/config.yaml:/app/config.yaml:ro
    depends_on:
      - litellm
    restart: always

  # 形式変換が要るもの (Anthropic / OpenAI) と Ollama のワイルドカード列挙だけを担当。
  # OpenAI 互換な上流 (vLLM / sglang / llama.cpp) は prism-gw が素通しするので
  # ここには載せない (LiteLLM を通すと max_model_len と累積 usage が消えるため)。
  #
  # **ホストには公開しない。** 入口は prism-gw の :4000 一本。
  litellm:
    # !! main-stable / main-latest は 1.82 系で止まっている (2026-08 時点) !!
    # 1.82 の /v1/models は id/object/created/owned_by の 4 キーしか返さず、
    # model_info を書いてもコンテキスト長が出ない。**1.96 から max_input_tokens /
    # max_output_tokens を返す**ので、版を明示的にピンする。
    image: ${LITELLM_IMAGE:-ghcr.io/berriai/litellm:v1.96.2}
    container_name: litellm
    command: ["--config", "/app/litellm/config.yaml"]
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      # prism-gw の後ろにしか居ないので、既定でゲートウェイのキーを流用する。
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:-${PRISM_GW_API_KEY:?Set PRISM_GW_API_KEY in .env (see .env.example)}}
      - CLAUDE_OAUTH_TOKEN=${CLAUDE_OAUTH_TOKEN:?Set CLAUDE_OAUTH_TOKEN in .env (see .env.example)}
      # kimi-k2.6 (llens) のみが使う。未設定でも他モデルは動くので必須にはしない。
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      # gpt-* (OpenAI 公式 API) のみが使う。同上、必須にはしない。
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DISABLE_SPEND_LOGS=True
      - LITELLM_MODE=DEV
    volumes:
      - ./litellm:/app/litellm
    restart: always

  # Qwen3.5-122B-A10B (INT4+FP8 hybrid, MTP-2) served by vLLM, optimized for the
  # DGX Spark (SM121). Image pulled from GHCR; model prepared on host via
  # scripts/fetch-model.sh. Build/versions/troubleshooting: docs/qwen35-vllm.md.
  vllm-qwen35:
    # Pulled from GHCR (built on the DGX Spark, pushed to prism-hu). Rebuild only
    # if needed: vendor/qwen35-spark/install.sh, then docker push (see docs).
    image: ${VLLM_QWEN35_IMAGE:-ghcr.io/prism-hu/vllm-qwen35-v2:latest}
    pull_policy: missing
    container_name: vllm-qwen35
    ipc: host
    # TZ takes effect on the NEXT vllm restart (don't recreate just for this — it
    # reloads the 122B model). Only affects log timestamps; inference is unaffected.
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ${MODELS_DIR:-./models}:/models
    command:
      - serve
      - ${QWEN_MODEL_PATH:-/models/qwen35-122b-hybrid-int4fp8}
      - --served-model-name=qwen
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.85
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --generation-config=auto
      # Qwen3.5 thinking-mode recommended sampling (HF model card). Merges over the
      # checkpoint's generation_config.json (which ships temp=0.6) as server-side
      # defaults; clients can still override per-request. Applies after next restart.
      - '--override-generation-config={"temperature":1.0,"top_p":0.95,"top_k":20,"presence_penalty":1.5}'
      - --attention-backend=FLASHINFER
      - '--speculative-config={"method":"mtp","num_speculative_tokens":2}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

  # Qwen3.6-35B-A3B (NVFP4) — 総 35B / アクティブ 3B の MoE VLM。vision + tools +
  # thinking、ctx 262144。アーキテクチャは Qwen3.5 と同一
  # (Qwen3_5MoeForConditionalGeneration) だが、**vllm-qwen35 のカスタムイメージでは
  # 動かない** (下記)。実測 decode 78.5 t/s = ollama の Q4_K_M (57 t/s) の +38%。
  #
  # 重みは NVIDIA 公式 NVFP4 (modelopt MIXED_PRECISION) で 20.4GiB + FP8 KV:
  #   hf download nvidia/Qwen3.6-35B-A3B-NVFP4 --local-dir ~/models/qwen36-35b-a3b-nvfp4
  #
  # vllm-qwen35 / llamacpp-step37 とは排他 (GPU を丸ごと使う)。ただし本体が軽いので
  # gpu-memory-utilization を絞ってあり、ホストの ollama とは同居できる。
  # 計測値・不採用にした選択肢の記録: docs/qwen36-vllm.md
  vllm-qwen36:
    # 上流公式イメージ。arm64 マニフェストあり、CUDA 13.0 / torch 2.11。
    # arch_list は sm_120 までだが GB10 (cc 12.1) で動くことを実機確認済み
    # (Blackwell は sm_120 の cubin が sm_121 で動く)。
    #
    # カスタム SM121 ビルド (ghcr.io/prism-hu/vllm-qwen35-v2, 0.19.1.dev0) は
    # NVFP4 の MoE を読めず `KeyError: layers.0.mlp.experts.w2_input_scale` で落ちる。
    # NGC 版 (nvcr.io/nvidia/vllm:26.07-py3, 0.24.0) は動くが decode が遅く
    # (76.8 t/s)、DSpark スペキュレータにも非対応。上流が最良。
    image: ${VLLM_QWEN36_IMAGE:-vllm/vllm-openai:v0.26.0}
    pull_policy: missing
    container_name: vllm-qwen36
    ipc: host
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ${MODELS_DIR:-./models}:/models
    # !! このイメージの ENTRYPOINT は ["vllm","serve"] !! カスタムイメージ (["vllm"])
    # と違い `serve` を書くと `vllm serve serve ...` になって起動しない。
    command:
      - --model=${QWEN36_MODEL_PATH:-/models/qwen36-35b-a3b-nvfp4}
      - --served-model-name=qwen36
      - --port=8000
      - --max-model-len=262144
      # 重み 20.4GiB。0.55 で vLLM が ~67GiB 確保し、うち ~40GiB が KV cache
      # (FP8 KV なので 300万トークン超が載る = 262144 の 11 並列以上)。
      # 残り ~55GiB はホストの ollama 用に空けてある。単独で使い切るなら 0.85。
      - --gpu-memory-utilization=0.55
      # NVFP4 チェックポイントは hf_quant_config に kv_cache_quant_algo=FP8 を持つ。
      # 明示すると KV が FP8 で確保され、同じメモリで倍のコンテキストが載る。
      - --kv-cache-dtype=fp8
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      # Qwen3.6 の推奨は qwen3_coder (Qwen3.5 の qwen3_xml とは別物。model card 準拠)
      - --tool-call-parser=qwen3_coder
      - --generation-config=auto
      # Qwen3.6 thinking モードの推奨サンプリング (model card)。
      # コード用途は temperature 0.6 / presence_penalty 0.0 が推奨なので、
      # そちらはリクエスト側で上書きする。
      - '--override-generation-config={"temperature":1.0,"top_p":0.95,"top_k":20,"presence_penalty":1.5}'
      - --attention-backend=FLASHINFER
      # 投機デコードは無し。公式チェックポイント (base / FP8 / NVFP4) の config に
      # num_nextn_predict_layers が無く MTP 重みが同梱されていない。DGX Spark 専用の
      # RedHatAI/Qwen3.6-35B-A3B-speculator.dspark も試したが、NVFP4 ベースだと
      # ドラフト生成で CUDA device-side assert (docs/qwen36-vllm.md)。
      #
      # --kernel-config '{"moe_backend":"flashinfer_b12x"}' で SM121 ネイティブ FP4 の
      # MoE カーネルを使えるが、decode は帯域律速なので効果なし (78.4 対 78.5 t/s)。
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: "no"

  # Step-3.7-Flash (StepFun, 198B MoE VLM / active ~11B / vision あり) を llama.cpp で。
  # 量子化は公式 GGUF IQ4_XS (105GB) + mmproj f16 (4GB)。モデルは host 側に置く:
  #   hf download stepfun-ai/Step-3.7-Flash-GGUF --include "IQ4_XS/*" \
  #     --include "mmproj-step3.7-flash-f16.gguf" --local-dir ~/models/step37-flash-iq4xs
  #
  # 現状は停止中 (速度が実用に届かず vllm-qwen35 に戻した。docs 参照)。
  #
  # !! vllm-qwen35 とは同時に起動できない (105GB + 100GB > 128GB 統合メモリ) !!
  #   docker compose stop vllm-qwen35
  #   docker compose up -d --build --no-deps llamacpp-step37
  # 戻すときは逆順。設定は両方残してあるので切り替えるだけ。
  # 詳細・チューニング・出典: docs/step37-llamacpp.md
  llamacpp-step37:
    image: llamacpp-step37:local
    build:
      context: ./llamacpp
      args:
        # 上流 master が既定 (MTP のドラフトが読めるのは上流だけ)。StepFun の
        # fork に戻すときはここを書き換えるか --build-arg で上書きする。
        LLAMACPP_REPO: ${LLAMACPP_REPO:-https://github.com/ggml-org/llama.cpp.git}
        LLAMACPP_REF: ${LLAMACPP_REF:-master}
        CMAKE_CUDA_ARCHITECTURES: ${CMAKE_CUDA_ARCHITECTURES:-121}
        BUILD_JOBS: ${BUILD_JOBS:-2}
    container_name: llamacpp-step37
    ipc: host
    shm_size: "16gb"
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ${MODELS_DIR:-./models}:/models
    # 分割 GGUF は 1 個目を渡せば残りのシャードを同じディレクトリから自動で拾う。
    command:
      - --model
      - ${STEP37_MODEL_PATH:-/models/step37-flash-iq4xs/IQ4_XS/Step-3.7-flash-IQ4_XS-00001-of-00003.gguf}
      # vision (mmproj)。このモデルを置いておく理由が vision なので有効にしてある。
      # !! vision (mmproj) と MTP は排他 !!
      #    両方有効にすると画像を投げた瞬間に 500
      #    (`decode() failed: failed to process speculative batch`)。
      #    common_speculative_process() が全バッチに対して走る一方、MTP ドラフトは
      #    画像埋め込み (token でなく embd の batch) を処理できないため。設定では
      #    回避不可 (リクエスト単位の speculative.n_max: 0 でも同じ)。
      #    速度を取るなら下 2 行を消して --spec-* 4 行のコメントを外す (decode +30%)。
      - --mmproj
      - ${STEP37_MMPROJ_PATH:-/models/step37-flash-iq4xs/mmproj-step3.7-flash-f16.gguf}
      - --alias
      - step37
      - --host
      - 0.0.0.0
      - --port
      - "8000"
      # 256K まで入るが weights で 105GB 使っているので KV に回せる余地が薄い。
      # まず 64K で立ち上げ、空きを見ながら上げる (docs/step37-llamacpp.md)。
      - --ctx-size
      - "65536"
      - --cache-type-k
      - q8_0
      - --cache-type-v
      - q8_0
      - --n-gpu-layers
      - "999"
      - --flash-attn
      - "on"
      # 統合メモリ機の llama.cpp は並列リクエストでキャッシュを二重に持って落ちる。
      # DGX Spark では並列 1 が事実上必須。
      - --parallel
      - "1"
      - --no-mmap
      # MTP (Multi-Token Prediction) 投機デコード。decode +30% だが上の vision と
      # 排他なので今は無効。使うときは上の --mmproj 2 行を消してここを戻す。
      # ドラフト重み Q8_0 で +3.7GB。
      # !! StepFun 公式の Step3.7-flash-mtp-Q8_0.gguf は使えない !!
      #    fork の llama.cpp では `missing tensor 'blk.0.attn_norm.weight'` で
      #    起動に失敗する。MTP-tail のドラフト読み込みに対応しているのは上流
      #    master 側で、ドラフトも notSnix のものを使う (docs/step37-llamacpp.md)。
      # - --spec-type
      # - draft-mtp
      # - --spec-draft-model
      # - ${STEP37_MTP_PATH:-/models/step37-flash-iq4xs/Step-3.7-Flash-MTP-Q8_0.gguf}
      # notSnix がスイープして出した推奨値。n-max を上げすぎると外れたときの
      # やり直しコストで逆に遅くなる。
      # - --spec-draft-n-max
      # - "2"
      # - --spec-draft-p-min
      # - "0.60"
      # チャットテンプレートは GGUF 内蔵。--jinja がないと tool call も
      # reasoning_effort も効かないので必須。
      - --jinja
      - --metrics
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    # 105GB のロードをリトライループで回すと目も当てられないので、挙動が安定
    # するまでは手動起動。安定したら always に変える。
    restart: "no"

volumes:
  nucllei:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
