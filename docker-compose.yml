services:
  nucllei:
    # technoplasm/nucllei — Open WebUI fork used as the chat frontend.
    # 上流 CI が GHCR に出すのは amd64 のみ。DGX Spark は aarch64 なので
    # submodule (vendor/nucllei) から自前ビルドする:
    #   git submodule update --init --recursive
    #   docker compose build nucllei
    # 版を上げるときは submodule を目的の tag に進めてから再ビルド。
    image: nucllei:local
    build:
      context: ./vendor/nucllei
    container_name: nucllei
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      # public base URL (RC): webhooks / share links
      - WEBUI_URL=https://chat.prism-hu.org
      # shipped locales: ja / en / zh-CN
      - DEFAULT_LOCALE=ja
      # LiteLLM is the only host we talk to, but through TWO routes (`;`-separated):
      #   /v1     — normal LiteLLM routing (Claude / vLLM / Ollama)
      #   /sglang — raw pass-through to the external sglang (kimi-k2.6). LiteLLM
      #             rebuilds streams and loses sglang's usage/context extensions, so
      #             kimi bypasses routing to keep live tok/s and the context gauge.
      #             Rationale in litellm/config.yaml (general_settings).
      # Both carry the same master key; the pass-through swaps in KIMI_API_KEY upstream.
      # Ollama is not wired up directly — it is a wildcard route in litellm/config.yaml.
      - OPENAI_API_BASE_URLS=http://litellm:4000/v1;http://litellm:4000/sglang
      - OPENAI_API_KEYS=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env (see .env.example)};${LITELLM_MASTER_KEY}
      - ENABLE_OLLAMA_API=false
    ports:
      - "8080:8080"
    volumes:
      # DATA_DIR: SQLite webui.db, uploads, caches, secret key
      - nucllei:/app/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      - litellm
    restart: always

  litellm:
    image: ghcr.io/berriai/litellm:main-stable
    container_name: litellm
    ports:
      - "4000:4000"
    command: ["--config", "/app/litellm/config.yaml"]
    environment:
      - TZ=${TZ:-Asia/Tokyo}
      - LITELLM_MASTER_KEY=${LITELLM_MASTER_KEY:?Set LITELLM_MASTER_KEY in .env (see .env.example)}
      - CLAUDE_OAUTH_TOKEN=${CLAUDE_OAUTH_TOKEN:?Set CLAUDE_OAUTH_TOKEN in .env (see .env.example)}
      # kimi-k2.6 (llens) のみが使う。未設定でも他モデルは動くので必須にはしない。
      - KIMI_API_KEY=${KIMI_API_KEY:-}
      - DISABLE_SPEND_LOGS=True
      - LITELLM_MODE=DEV
    volumes:
      - ./litellm:/app/litellm
    restart: always

  # Qwen3.5-122B-A10B (INT4+FP8 hybrid, MTP-2) served by vLLM, optimized for the
  # DGX Spark (SM121). Image pulled from GHCR; model prepared on host via
  # scripts/fetch-model.sh. Build/versions/troubleshooting: docs/qwen35-vllm.md.
  vllm-qwen35:
    # Pulled from GHCR (built on the DGX Spark, pushed to prism-hu). Rebuild only
    # if needed: vendor/qwen35-spark/install.sh, then docker push (see docs).
    image: ${VLLM_QWEN35_IMAGE:-ghcr.io/prism-hu/vllm-qwen35-v2:latest}
    pull_policy: missing
    container_name: vllm-qwen35
    ipc: host
    # TZ takes effect on the NEXT vllm restart (don't recreate just for this — it
    # reloads the 122B model). Only affects log timestamps; inference is unaffected.
    environment:
      - TZ=${TZ:-Asia/Tokyo}
    volumes:
      - ${MODELS_DIR:-./models}:/models
    command:
      - serve
      - ${QWEN_MODEL_PATH:-/models/qwen35-122b-hybrid-int4fp8}
      - --served-model-name=qwen
      - --port=8000
      - --max-model-len=262144
      - --gpu-memory-utilization=0.85
      - --reasoning-parser=qwen3
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_xml
      - --generation-config=auto
      # Qwen3.5 thinking-mode recommended sampling (HF model card). Merges over the
      # checkpoint's generation_config.json (which ships temp=0.6) as server-side
      # defaults; clients can still override per-request. Applies after next restart.
      - '--override-generation-config={"temperature":1.0,"top_p":0.95,"top_k":20,"presence_penalty":1.5}'
      - --attention-backend=FLASHINFER
      - '--speculative-config={"method":"mtp","num_speculative_tokens":2}'
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: all
              capabilities: [gpu]
    restart: always

volumes:
  nucllei:

networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/16
          gateway: 172.28.0.1
