# prism-gw — OpenAI 互換の透過ゲートウェイ
#
# 目的は 3 つだけ:
#   1. 入口を :4000 の /v1 一本に統一し、クライアントのキーを 1 本にする
#   2. 上流の応答を **組み直さずバイトのまま**返す
#      (LiteLLM も Bifrost も組み直すため、sglang/vLLM の `max_model_len` と
#       ストリーム中の累積 usage が消える。docs/gateway.md に実測あり)
#   3. /v1/models を 1 つに統合し、全モデルに `max_model_len` を持たせる
#      (Nucllei のコンテキストゲージはこのキーだけを見る)
#
# ${VAR} は環境変数に展開される。${VAR:-既定値} も使える。

# クライアントが名乗るキー。**これ 1 本で下の全モデルに到達できる。**
# 上流のキー (KIMI_API_KEY 等) はここで差し替わり、クライアントには出ない。
auth:
  key: ${PRISM_GW_API_KEY}

upstreams:
  # 変換が必要なもの (Anthropic / OpenAI) と Ollama のワイルドカード列挙を担当。
  # ここだけは素通しにできない (形式変換が要る) ので、LiteLLM の制約を引き継ぐ。
  litellm:
    base_url: http://litellm:4000/v1
    # compose が必ず値を渡す (未設定なら PRISM_GW_API_KEY を流用する)。
    # ここで入れ子の既定値は書かない — app.py の展開は入れ子に対応していない。
    api_key: ${LITELLM_MASTER_KEY}

  # Qwen3.8-Flash-Next (vLLM, 1 台構成)。**compose のサービスではない** —
  # vendor/qwen38-flash-next の start.sh が `--network host` でホストの :8888 に
  # 立てるので、ollama と同じくブリッジ GW 経由で見る。起動/停止は
  #   cd vendor/qwen38-flash-next && ./start.sh   /   ./stop.sh
  # **27B (sglang-qwen38) とは排他。** 先に `docker compose stop sglang-qwen38`。
  # 詳細は docs/qwen3.8-flash-next-tp2.md。
  qwen38-flash-next:
    base_url: http://172.28.0.1:8888/v1
    force_continuous_usage: true

  # SGLang (Qwen3.8-27B)。continuous_usage_stats に対応しているので有効化する。
  # **LiteLLM には載せない** — 通すと max_model_len とストリーム中の累積 usage が
  # 消える (docs/gateway.md)。この 2 つが欲しくて SGLang を選んでいるので本末転倒。
  sglang-qwen38:
    base_url: http://sglang-qwen38:8000/v1
    force_continuous_usage: true

  vllm-qwen36:
    base_url: http://vllm-qwen36:8000/v1
    force_continuous_usage: true

  vllm-qwen35:
    base_url: http://vllm-qwen35:8000/v1
    force_continuous_usage: true

  llamacpp-step37:
    base_url: http://llamacpp-step37:8000/v1

# --- 明示ルート ---
# name: クライアントから見えるモデル名 / upstream_model: 上流での実名
# context を書かなければ上流の /v1/models の max_model_len をそのまま使う。
models:
  # kimi-k2.6 (北大 llens / H200) — 2026-09-21 撤去。H200 がこのネットワークから
  # 到達できない場所へ移設されたため、このルートと upstreams: の sglang-llens を
  # **両方**外した (ルートだけ残すと `unknown upstream` で落ちる)。死んだ上流を
  # 残すと /v1/models が毎回 connect timeout 分待たされる (実測 8.02s → 0.005s)。
  # 復活させるときは両方まるごと `git show 6d6852f^:gateway/config.yaml` にある。

  - name: qwen3.8-flash-next
    upstream: qwen38-flash-next
    upstream_model: qwen3.8-flash-next

  - name: qwen3.8-27b
    upstream: sglang-qwen38
    upstream_model: qwen38

  - name: qwen3.6-35b
    upstream: vllm-qwen36
    upstream_model: qwen36

  # 停止中のサービス。上流に繋がらない間は /v1/models から自動的に外れる。
  - name: qwen3.5-122b-custom
    upstream: vllm-qwen35
    upstream_model: qwen
  - name: step-3.7-flash
    upstream: llamacpp-step37
    upstream_model: step37
    # llama.cpp は max_model_len を返さないので明示する (compose の --ctx-size と揃える)
    context: 65536

# --- 取り込みルート ---
# 上流の /v1/models をそのまま自分の一覧に載せる。`ollama pull` したものが
# 設定変更なしで出てくるのはこの経路。
include:
  - upstream: litellm
    # LiteLLM 1.96+ は max_input_tokens を返すので max_model_len に読み替える。
    context_from: [max_model_len, max_input_tokens]
    # 一覧に出さないもの。**完全一致**なので `ollama/*` は
    # ワイルドカード定義そのものだけを落とし、配下の実モデルは残る。
    # (パターンで消したいときは exclude_glob)
    exclude: ["ollama/*"]
    # url が 2xx を返す間だけ、glob に合うモデルを一覧に出す (こちらはグロブ)。
    # Ollama が止まっていると LiteLLM は静的な組み込みリストにフォールバックし、
    # 実在しない `ollama/llama2` を返してくる。それを一覧に出さないための生存確認。
    # 確認は一覧取得と並列・タイムアウト 1 秒なので、落ちていても一覧は遅くならない
    # (停止中は connection refused で即座に返る)。**一覧だけ**に効き、
    # リクエストの振り分けは変わらない。url は litellm/config.yaml の api_base と揃える。
    require_alive:
      - glob: "ollama/*"
        url: http://172.28.0.1:11434/api/version
    # 上で明示ルートを持つモデルは重複するので取り込まない
    skip_declared: true
