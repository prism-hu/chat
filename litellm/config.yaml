model_list:
  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/CLAUDE_OAUTH_TOKEN

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/CLAUDE_OAUTH_TOKEN

  # --- OpenAI (公式 API 直) ---
  # キーは ~/chat/.env の OPENAI_API_KEY。未設定/空でも litellm は起動し
  # /v1/models にも並ぶが、リクエストは 401 になる。
  # 推論モデル (gpt-5.x) は temperature/top_p を受け付けない → drop_params: true
  # が落とすので、ここでは sampling を指定しない。
  #
  # gpt-5.6 ラインナップ (2026-08 時点)。3つとも context 1.05M / chat mode。
  # 価格は $/1M tokens (in / out、cached in はその 1/10):
  #   luna   0.20 /  1.20   — 低価格枠。日常用
  #   terra  2.00 / 12.00   — 中位。旧 gpt-5.4 ($2.50/$15.00) の下位互換的な位置
  #   sol    5.00 / 30.00   — フラッグシップ。gpt-5.5 / gpt-5.6 base と同額
  # 参考: 旧 gpt-5.1 は $1.25/$10.00 で context 272K。
  #
  # 使うモデルを増やすときはこのブロックに追記する。実際に使える ID は
  #   curl -s https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY"
  # で確認できる (2026-08 時点で 125 件)。ただし mode が `responses` のモデル
  # (gpt-5.x-pro / -codex 系) は Chat Completions では叩けないので注意。
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY

  # --- Ollama (host, via the docker bridge gateway) ---
  # Wildcard route: LiteLLM matches `ollama/<name>` at request time (PatternMatchRouter)
  # and lists the host's ACTUAL models in /v1/models by calling Ollama's /api/tags
  # (requires check_provider_endpoint below). So `ollama pull` shows up with no edit
  # here. Model names carry the `ollama/` prefix (e.g. `ollama/gpt-oss:20b`).
  - model_name: ollama/*
    litellm_params:
      model: ollama/*
      api_base: http://172.28.0.1:11434

  # --- vLLM custom build (DGX Spark SM121), served by the vllm-qwen35 service ---
  - model_name: qwen3.5-122b-custom
    litellm_params:
      model: openai/qwen
      api_base: http://vllm-qwen35:8000/v1
      api_key: dummy
      # Qwen3.5 thinking-mode recommended sampling (HF model card) — mirrors the
      # vLLM `--override-generation-config`. top_k is non-OpenAI → extra_body.
      temperature: 1.0
      top_p: 0.95
      presence_penalty: 1.5
      extra_body: {"top_k": 20}

  # --- External OpenAI-compatible endpoint (Hokudai / llens, sglang: kimi-k2.6) ---
  # Reached over the public internet (not in-network). 2026-07 に認証必須化された
  # (api_key: dummy だと 401 Unauthorized)。キーは ~/chat/.env の KIMI_API_KEY。
  - model_name: kimi-k2.6
    litellm_params:
      model: openai/kimi-k2.6
      api_base: http://llens.med.hokudai.ac.jp:13300/v1
      api_key: os.environ/KIMI_API_KEY
      # Kimi K2.6 official recommended sampling (Thinking mode; this endpoint is a
      # thinking model). temperature=1.0 / top_p=0.95. No official top_k. Refs:
      # huggingface.co/moonshotai/Kimi-K2.6 , kimi-k2.org/blog/24-kimi-k2-6-release
      temperature: 1.0
      top_p: 0.95

litellm_settings:
  drop_params: true
  # Resolve wildcard routes against the live provider endpoint instead of a static
  # built-in list — this is what makes `ollama/*` expand to the models actually
  # installed on the host. Only affects wildcard entries; the explicit models above
  # are listed as-is. If Ollama is down, /v1/models falls back to a static list.
  check_provider_endpoint: true
