model_list:
  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/CLAUDE_OAUTH_TOKEN

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/CLAUDE_OAUTH_TOKEN

  # --- OpenAI (公式 API 直) ---
  # キーは ~/chat/.env の OPENAI_API_KEY。未設定/空でも litellm は起動し
  # /v1/models にも並ぶが、リクエストは 401 になる。
  # 推論モデル (gpt-5.x) は temperature/top_p を受け付けない → drop_params: true
  # が落とすので、ここでは sampling を指定しない。
  #
  # gpt-5.6 ラインナップ (2026-08 時点)。3つとも context 1.05M / chat mode。
  # 価格は $/1M tokens (in / out、cached in はその 1/10):
  #   luna   0.20 /  1.20   — 低価格枠。日常用
  #   terra  2.00 / 12.00   — 中位。旧 gpt-5.4 ($2.50/$15.00) の下位互換的な位置
  #   sol    5.00 / 30.00   — フラッグシップ。gpt-5.5 / gpt-5.6 base と同額
  # 参考: 旧 gpt-5.1 は $1.25/$10.00 で context 272K。
  #
  # 使うモデルを増やすときはこのブロックに追記する。実際に使える ID は
  #   curl -s https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY"
  # で確認できる (2026-08 時点で 125 件)。ただし mode が `responses` のモデル
  # (gpt-5.x-pro / -codex 系) は Chat Completions では叩けないので注意。
  - model_name: gpt-5.6-luna
    litellm_params:
      model: openai/gpt-5.6-luna
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.6-terra
    litellm_params:
      model: openai/gpt-5.6-terra
      api_key: os.environ/OPENAI_API_KEY

  - model_name: gpt-5.6-sol
    litellm_params:
      model: openai/gpt-5.6-sol
      api_key: os.environ/OPENAI_API_KEY

  # --- ChatGPT サブスク (Codex OAuth)。API キーではなく OAuth。 ---
  # 上の gpt-5.6-* が **従量課金の公式 API**、こちらが **サブスクの枠**。中身は
  # 同じモデルでも課金先が違うので、クライアントから見える名前を `codex/` 前置き
  # にして取り違えを防ぐ (ollama/* と同じ考え方)。
  #
  # **前置きが 2 種類あるので混同しないこと:**
  #   model_name        `codex/...`    クライアントに見える名前。**ただの別名**で
  #                                    中身は何でもよい。prism-gw はこれをそのまま
  #                                    /v1/models に載せる。
  #   litellm_params.model `chatgpt/...` **プロバイダ選択子。変更不可。**
  #                                    litellm はこの前置きで chatgpt プロバイダ
  #                                    (OAuth 認証) に振り分ける。
  #
  # `codex/` は「Codex CLI の OAuth 枠から出ている」という意味で、**Codex モデル
  # という意味ではない**。皮肉なことに本物の codex-* は下記のとおり全部使えない。
  #
  # なお model_name を codex/ に変えても、**クライアントが `chatgpt/gpt-5.6-sol`
  # と直接名乗れば依然として通る** (litellm が未宣言のモデル名をプロバイダ直指定
  # として解釈するため)。/v1/models には codex/ しか出ないので実用上は困らないが、
  # 「旧名を塞いだ」わけではないことは意識しておく。
  #
  # 認証は API キーではなく device code flow。トークンは CHATGPT_TOKEN_DIR
  # (compose で /app/chatgpt-auth) の auth.json に入り、ホストの
  # ./litellm/chatgpt-auth/ に永続する (.gitignore 済み)。期限切れは
  # refresh_token で自動更新されるので、通常この手順は 1 回だけ。
  #
  # **罠: auth.json にトークンが無い状態でここを生かして litellm を起動すると、
  # ポートを bind する前に device code flow に入ってブロックする。** listen しない
  # ので claude/gpt/gemini/ollama が丸ごと /v1/models から消える (実測済み)。
  # なのでログインは**デーモンにさせず、使い捨てコンテナで先に済ませる**:
  #
  #   docker run --rm -v "$PWD/litellm/chatgpt-auth:/auth" -e CHATGPT_TOKEN_DIR=/auth \
  #     --entrypoint python ghcr.io/berriai/litellm:v1.96.2 -u -c \
  #     "from litellm.llms.chatgpt.authenticator import Authenticator; \
  #      print(Authenticator().get_access_token()[:12])"
  #
  # 出てくる URL と code をブラウザで承認すると auth.json が書かれる。
  # 一度 device code を要求すると **5 分の cooldown** があり、その間は無言で待つ。
  #
  # litellm 1.96.2 が知っている chatgpt/* 14 個を 2026-09-21 に総当たりした結果、
  # **このアカウントで通ったのは下の 4 つだけ**。
  #   通る: gpt-5.5 / gpt-5.6-luna / gpt-5.6-sol / gpt-5.6-terra
  #   拒否: gpt-5.1-codex-max, gpt-5.1-codex-mini, gpt-5.2, gpt-5.2-codex,
  #         gpt-5.3-chat-latest, gpt-5.3-codex, gpt-5.3-codex-spark,
  #         gpt-5.3-instant, gpt-5.4, gpt-5.4-pro
  #         → いずれも backend が 400 で
  #           "The '<model>' model is not supported when using Codex with a
  #            ChatGPT account."
  # **Codex ブランドのモデル ID は軒並み使えない。** プランが変わったら再度
  # 総当たりして、この一覧を更新すること。
  #
  # 注意:
  #   - **クライアントが stream: true を送ること。必須。** この backend は非
  #     ストリームだと空の output を返し、litellm が 500 で落ちる:
  #       "Unknown items in responses API response: []"
  #     responses API 経由でも中身は streaming iterator が返ってくるので、
  #     そもそも非ストリームの口が無いと思ってよい。
  #     **litellm_params に stream を書いても救えない** (実測: 非ストリームの
  #     リクエストは同じ 500 のまま)。ここでは書かず、呼ぶ側の責任にしている。
  #     fugu / Nucllei は通常ストリームで呼ぶので実用上は問題ない。
  #   - サブスク backend は max_tokens / max_output_tokens / max_completion_tokens
  #     と metadata を**拒否する**。litellm が落とすので設定は不要。
  #   - ChatGPT サブスクを公式クライアント以外から叩くのは OpenAI の利用規約上
  #     グレー。アカウント停止のリスクは自分持ちで使うこと。
  - model_name: codex/gpt-5.6-sol
    litellm_params:
      model: chatgpt/gpt-5.6-sol

  - model_name: codex/gpt-5.6-terra
    litellm_params:
      model: chatgpt/gpt-5.6-terra

  - model_name: codex/gpt-5.6-luna
    litellm_params:
      model: chatgpt/gpt-5.6-luna

  - model_name: codex/gpt-5.5
    litellm_params:
      model: chatgpt/gpt-5.5

  # --- Gemini (Google AI Studio の Gemini Developer API 直) ---
  # キーは ~/chat/.env の GEMINI_API_KEY (https://aistudio.google.com/apikey)。
  # 未設定/空でも litellm は起動し /v1/models にも並ぶが、リクエストは 401 になる。
  #
  # 注意: **Google AI Pro の購読は API の無料トークンにはならない**。
  #   - Pro の quota 増加は AI Studio の Web UI 内だけ。API キー経由は対象外。
  #   - Pro に付くのは Google Developer Program の $10/月 Cloud クレジット
  #     (Ultra は $100/月)。GCP プロジェクトに Cloud Billing を紐づけて有効化すると
  #     Gemini API の課金に充当できる。
  #   - 課金を付けない素の API キーにも無料枠はあるが Flash 系でも RPD が極小
  #     (3.8 Flash は 20 RPD 規模の報告あり)。実際の枠は
  #     https://aistudio.google.com/rate-limit で確認する。
  #
  # 価格 ($/1M tokens, in/out)。3.8 Flash は **2026-12-31 まで**の導入価格で、
  # 2027-01-01 に両方 2 倍 (1.50 / 7.50) になる。batch/flex は半額。
  #   gemini-3.8-flash       0.75 / 3.75
  # context 1,048,576 in / 65,536 out。
  # thinking は既定で ON。**このモデルは thinking で性能を出す設計**なので切らず、
  # 間を取って medium を既定にする。実測 (「自己紹介を一文で」):
  #     low    reasoning   0 / text 25
  #     medium reasoning 166 / text 13
  #     high   reasoning 479 / text 13
  #   - `none` / `minimal` は 400 "Thinking level MINIMAL is not supported"。
  #     このモデルで thinking を完全に切ることはできない。low が下限。
  #   - Anthropic 形式の `thinking: {budget_tokens: 0}` は**黙って無視される**
  #     (drop_params が落とす)。効くのは reasoning_effort だけ。
  # 出力は $3.75/1M で reasoning も出力側に課金されるので、$10 枠を意識するなら
  # リクエスト側で `reasoning_effort` を送って上書きする (リクエスト値が勝つ)。
  - model_name: gemini-3.8-flash
    litellm_params:
      model: gemini/gemini-3.8-flash
      api_key: os.environ/GEMINI_API_KEY
      reasoning_effort: medium

  # --- Ollama (host, via the docker bridge gateway) ---
  # Wildcard route: LiteLLM matches `ollama/<name>` at request time (PatternMatchRouter)
  # and lists the host's ACTUAL models in /v1/models by calling Ollama's /api/tags
  # (requires check_provider_endpoint below). So `ollama pull` shows up with no edit
  # here. Model names carry the `ollama/` prefix (e.g. `ollama/gpt-oss:20b`).
  - model_name: ollama/*
    litellm_params:
      model: ollama/*
      api_base: http://172.28.0.1:11434

  # NOTE: OpenAI 互換の上流 (vLLM qwen3.5/3.6, llama.cpp step37, sglang kimi) は
  # ここには載せない。prism-gw が直接・無改変で中継する (gateway/config.yaml)。
  # LiteLLM を通すと /v1/models の `max_model_len` とストリーム中の累積 usage が
  # 消えるため。ここに戻すなら gateway/config.yaml の該当ルートを外すこと。

litellm_settings:
  drop_params: true
  # Resolve wildcard routes against the live provider endpoint instead of a static
  # built-in list — this is what makes `ollama/*` expand to the models actually
  # installed on the host. Only affects wildcard entries; the explicit models above
  # are listed as-is. If Ollama is down, /v1/models falls back to a static list.
  check_provider_endpoint: true
