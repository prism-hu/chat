model_list:
  - model_name: claude-opus-4-6
    litellm_params:
      model: anthropic/claude-opus-4-6
      api_key: os.environ/CLAUDE_OAUTH_TOKEN

  - model_name: claude-sonnet-4-6
    litellm_params:
      model: anthropic/claude-sonnet-4-6
      api_key: os.environ/CLAUDE_OAUTH_TOKEN

  # --- Ollama (host, via the docker bridge gateway) ---
  # Wildcard route: LiteLLM matches `ollama/<name>` at request time (PatternMatchRouter)
  # and lists the host's ACTUAL models in /v1/models by calling Ollama's /api/tags
  # (requires check_provider_endpoint below). So `ollama pull` shows up with no edit
  # here. Model names carry the `ollama/` prefix (e.g. `ollama/gpt-oss:20b`).
  - model_name: ollama/*
    litellm_params:
      model: ollama/*
      api_base: http://172.28.0.1:11434

  # --- vLLM custom build (DGX Spark SM121), served by the vllm-qwen35 service ---
  - model_name: qwen3.5-122b-custom
    litellm_params:
      model: openai/qwen
      api_base: http://vllm-qwen35:8000/v1
      api_key: dummy
      # Qwen3.5 thinking-mode recommended sampling (HF model card) — mirrors the
      # vLLM `--override-generation-config`. top_k is non-OpenAI → extra_body.
      temperature: 1.0
      top_p: 0.95
      presence_penalty: 1.5
      extra_body: {"top_k": 20}

  # NOTE: kimi-k2.6 (Hokudai / llens, sglang) is deliberately NOT in model_list.
  # It is served through the raw pass-through route below — see general_settings.

litellm_settings:
  drop_params: true
  # Resolve wildcard routes against the live provider endpoint instead of a static
  # built-in list — this is what makes `ollama/*` expand to the models actually
  # installed on the host. Only affects wildcard entries; the explicit models above
  # are listed as-is. If Ollama is down, /v1/models falls back to a static list.
  check_provider_endpoint: true

general_settings:
  # --- Raw pass-through to the external sglang (Hokudai / llens, kimi-k2.6) ---
  #
  # Why not a normal model_list entry: LiteLLM does not proxy a stream, it takes it
  # apart and rebuilds it, and sglang's usage extensions do not survive that.
  # Specifically, litellm_core_utils/streaming_handler.py deletes `usage` from every
  # chunk ("remove usage from chunk, only send on final chunk") and synthesizes a
  # single usage chunk at the end, so Nucllei's live tok/s has nothing to read; and
  # /v1/models drops sglang's `max_model_len`, so the context gauge loses its
  # denominator. Neither is configurable — both are hardcoded (checked against
  # v1.82.3 and 1.96.2).
  #
  # A pass-through route is a byte-for-byte proxy (streaming_handler.py just yields
  # `response.aiter_bytes()`), so the sglang stream arrives at Nucllei intact.
  # Requests are still authenticated with LITELLM_MASTER_KEY and still enter through
  # :4000 — we only give up LiteLLM's routing/spend tracking for this one model.
  #
  # `include_subpath` makes /sglang/<x> map to <target>/<x>, so both
  # /sglang/chat/completions and /sglang/models reach sglang. Methods default to
  # GET/POST/PUT/DELETE/PATCH.
  #
  # `auth: true` is REQUIRED, not decorative: without it LiteLLM returns a blank
  # UserAPIKeyAuth for the exact route and skips authentication entirely
  # (proxy/auth/user_api_key_auth.py — `if endpoint.get("auth") is not True`).
  # Port 4000 is reachable over Tailscale, so leaving it open is not acceptable.
  #
  # The client's Authorization header is NOT forwarded upstream (forward_headers
  # defaults to false), so the master key stops at LiteLLM and sglang only ever sees
  # KIMI_API_KEY from the header below.
  pass_through_endpoints:
    - path: "/sglang"
      target: "http://llens.med.hokudai.ac.jp:13300/v1"
      include_subpath: true
      auth: true
      headers:
        Authorization: "Bearer os.environ/KIMI_API_KEY"
